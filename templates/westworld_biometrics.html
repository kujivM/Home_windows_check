<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DELOS SYSTEM - HOST DIAGNOSTICS</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --delos-cyan: #4df8ff;
            --delos-cyan-dim: rgba(77, 248, 255, 0.2);
            --delos-bg: #050a0d;
            --delos-grey: #6b8294;
            --delos-alert: #ff3355;
            --delos-text: #c0f8ff;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--delos-bg);
            color: var(--delos-text);
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            height: 100vh;
            overflow: hidden;
            text-transform: uppercase;
            /* ブラウン管/モニター風のスキャンライン背景 */
            background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(77,248,255,0.03) 2px, rgba(77,248,255,0.03) 4px);
        }

        .main-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 30px;
            width: 100%;
            height: 100%;
            border: 1px solid var(--delos-cyan-dim);
            padding: 20px;
            position: relative;
            background: radial-gradient(circle at center, rgba(77,248,255,0.05) 0%, transparent 70%);
        }
        
        /* ===============================
           左パネル：頭部プロファイル
        =============================== */
        .left-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 1px solid var(--delos-cyan-dim);
            padding-top: 40px;
            position: relative;
        }

        /* 逆三角形のターゲットマーカー */
        .target-marker {
            position: absolute;
            top: 20px;
            width: 0; height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid var(--delos-cyan);
            filter: drop-shadow(0 0 8px var(--delos-cyan));
            z-index: 10;
        }

        .profile-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
        }

        /* ★顔写真の設定（シアン色に染めるフィルター付き） */
        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            opacity: 0.85;
            /* 画像をSF風のホログラムカラー（シアン）に変換 */
            filter: grayscale(100%) sepia(100%) hue-rotate(150deg) saturate(300%) contrast(1.2);
            /* 仮のシルエット。後でラズパイ内の画像に差し替えられます */
            background: url('https://upload.wikimedia.org/wikipedia/commons/7/7c/Profile_avatar_placeholder_large.png') center/cover;
            border: 2px solid var(--delos-cyan);
            box-shadow: 0 0 30px rgba(77,248,255,0.3);
            z-index: 2;
        }

        /* 回転する文字リング (SVG) */
        .ring-text {
            position: absolute;
            width: 280px;
            height: 280px;
            animation: spin 15s linear infinite;
        }

        /* 外側の点線リング */
        .ring-outer {
            position: absolute;
            width: 230px;
            height: 230px;
            border: 1px dashed var(--delos-cyan);
            border-radius: 50%;
            opacity: 0.4;
            animation: spin 25s linear infinite reverse;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* ===============================
           右パネル：高密度データ群
        =============================== */
        .right-panel {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 20px;
            padding-right: 10px;
        }
        
        /* システム診断（高密度文字）セクション */
        .sys-box {
            border: 1px solid var(--delos-cyan-dim);
            padding: 15px;
            background: rgba(77,248,255,0.02);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px 25px;
            position: relative;
        }
        /* 四隅の飾りカギ括弧 */
        .sys-box::before { content: ''; position: absolute; top: -1px; left: -1px; width: 10px; height: 10px; border-top: 2px solid var(--delos-cyan); border-left: 2px solid var(--delos-cyan); }
        .sys-box::after { content: ''; position: absolute; bottom: -1px; right: -1px; width: 10px; height: 10px; border-bottom: 2px solid var(--delos-cyan); border-right: 2px solid var(--delos-cyan); }

        .sys-item { display: flex; flex-direction: column; gap: 4px; }
        .sys-lbl { color: var(--delos-grey); font-size: 0.65rem; letter-spacing: 1px; }
        .sys-val { color: var(--delos-text); font-size: 0.85rem; }
        .sys-hl { color: var(--delos-cyan); font-weight: bold; }
        
        /* ミニプログレスバー */
        .bar-wrap { width: 100%; background: rgba(255,255,255,0.1); height: 4px; margin-top: 5px; }
        .bar-fill { height: 100%; background: var(--delos-cyan); box-shadow: 0 0 5px var(--delos-cyan); }

        /* タブ風のボタン群 */
        .tab-group {
            display: flex;
            gap: 10px;
            border-bottom: 1px dashed var(--delos-cyan-dim);
            padding-bottom: 10px;
            margin-top: 5px;
        }
        .tab-btn {
            border: 1px solid var(--delos-cyan);
            background: transparent;
            color: var(--delos-cyan);
            padding: 4px 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .tab-btn.active { background: var(--delos-cyan); color: var(--delos-bg); font-weight: bold; }

        /* ===============================
           生体データ大型表示 (HR / STP / SLP)
        =============================== */
        .vital-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 10px 0;
        }
        .v-block { display: flex; align-items: baseline; gap: 8px; }
        .v-lbl { color: var(--delos-grey); font-size: 1.2rem; display: flex; flex-direction: column; text-align: right; line-height: 1.1;}
        .v-lbl span { font-size: 0.5rem; }
        .v-val { color: var(--delos-cyan); font-size: 5rem; font-family: 'Rajdhani', sans-serif; font-weight: 700; line-height: 0.75; text-shadow: 0 0 15px rgba(77,248,255,0.4);}
        
        /* 波形アニメーション (SVG) */
        .ecg-box {
            height: 80px;
            width: 100%;
            border: 1px solid var(--delos-cyan-dim);
            background: rgba(77,248,255,0.02);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        .ecg-grid {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(77,248,255,0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(77,248,255,0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: 1;
        }
        .ecg-line {
            fill: none;
            stroke: var(--delos-cyan);
            stroke-width: 2.5;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 4px var(--delos-cyan));
            animation: ecg-scroll 4s linear infinite;
        }
        @keyframes ecg-scroll {
            to { transform: translateX(-400px); }
        }

        /* 下部コントロールボタン */
        .controls {
            display: flex; justify-content: space-between; margin-top: auto; border-top: 1px dashed var(--delos-cyan-dim); padding-top: 15px;
        }
        .action-btn {
            background: transparent; color: var(--delos-cyan); border: 1px solid var(--delos-cyan);
            padding: 8px 30px; font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 1rem;
            letter-spacing: 2px; cursor: pointer; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: all 0.2s;
        }
        .action-btn:hover { background: var(--delos-cyan); color: var(--delos-bg); }
        .btn-secondary { border-color: var(--delos-grey); color: var(--delos-grey); }
        .btn-secondary:hover { background: var(--delos-grey); color: var(--delos-bg); }

/* ==========================================
           スマホ縦向き（Portrait）特化レイアウト
           ========================================== */
        @media screen and (max-width: 768px) {
            body {
                height: auto; /* 縦長になるためスクロールを許可 */
                overflow-y: auto;
                padding: 10px;
            }
            .main-container {
                /* 左右2列だったものを、上下1列に変更 */
                display: flex;
                flex-direction: column;
                height: auto;
                gap: 15px;
                padding: 10px;
            }
            .left-panel {
                border-right: none;
                border-bottom: 1px dashed var(--delos-cyan-dim);
                padding-top: 10px;
                padding-bottom: 20px;
            }
            .target-marker {
                top: 0;
            }
            /* 顔写真サイズをスマホに合わせて少し縮小 */
            .profile-container {
                width: 200px;
                height: 200px;
                margin-top: 15px;
            }
            .profile-img {
                width: 120px;
                height: 120px;
            }
            .ring-text {
                width: 200px;
                height: 200px;
            }
            .ring-outer {
                width: 160px;
                height: 160px;
            }
            /* 高密度データ群をスマホ幅に調整 */
            .sys-box {
                grid-template-columns: repeat(2, 1fr); /* 3列から2列に変更 */
                gap: 10px;
            }
            .tab-group {
                flex-wrap: wrap; /* タブが入り切らない場合は折り返す */
            }
            /* 大型生体データをスマホ幅に調整 */
            .vital-row {
                flex-direction: column; /* 横並びから縦並びに変更 */
                align-items: flex-start;
                gap: 15px;
            }
            .v-block {
                flex-direction: row-reverse;
                justify-content: flex-end;
                width: 100%;
            }
            .v-lbl {
                text-align: left;
                align-items: flex-start;
            }
            .controls {
                flex-direction: column;
                gap: 10px;
            }
            .action-btn {
                width: 100%;
            }
        }

    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- 左パネル：頭部プロファイル -->
        <div class="left-panel">
            <div class="target-marker"></div>
            
            <div class="profile-container">
                <div class="ring-outer"></div>
                
                <!-- 回転するテキスト -->
                <svg class="ring-text" viewBox="0 0 100 100">
                    <path id="circlePath" d="M 50, 50 m -40, 0 a 40,40 0 1,1 80,0 a 40,40 0 1,1 -80,0" fill="none" />
                    <text font-size="7.5" fill="var(--delos-cyan)" font-family="'Share Tech Mono', monospace" letter-spacing="2">
                        <textPath href="#circlePath">HOST ID# AC5000487105 ◆ UPLINK ACTIVE ◆ BIOMETRIC SCAN ◆</textPath>
                    </text>
                </svg>

                <!-- 顔写真 -->
                <img class="profile-img" src="{{ url_for('static', filename='FACE.png') }}">            </div>

            <div style="margin-top: 40px; text-align: center; color: var(--delos-grey); font-size: 0.75rem; line-height: 1.5;">
                <span class="sys-hl">TARGET LOC:</span> YOKOHAMA RESIDENCE<br>
                <span class="sys-hl">SYS UPLINK:</span> ACTIVE / ENCRYPTED<br>
                <span class="sys-hl">SYNC STATE:</span> <span id="sync-status">WAITING...</span>
            </div>
        </div>

        <!-- 右パネル：高密度データ群 -->
        <div class="right-panel">
            
            <!-- 上段：システムダッシュボード風（高密度） -->
            <div class="sys-box">
                <div class="sys-item">
                    <span class="sys-lbl">CPU-01 REACTOR</span>
                    <span class="sys-val sys-hl">ON-LINE</span>
                    <div class="bar-wrap"><div class="bar-fill" style="width: 75%;"></div></div>
                </div>
                <div class="sys-item">
                    <span class="sys-lbl">SPEED / CORE</span>
                    <span class="sys-val">1.4 GHz <span class="sys-hl">STABLE</span></span>
                </div>
                <div class="sys-item">
                    <span class="sys-lbl">CURRENT SCENARIO</span>
                    <span class="sys-val sys-hl">NORMAL OPERATIONS</span>
                </div>
                <div class="sys-item">
                    <span class="sys-lbl">SYS. LOCATION</span>
                    <span class="sys-val">SECTOR-01 / MAIN</span>
                </div>
                <div class="sys-item">
                    <span class="sys-lbl">CORE VOLTAGE</span>
                    <span class="sys-val sys-hl">1.25V</span>
                    <div class="bar-wrap"><div class="bar-fill" style="width: 45%;"></div></div>
                </div>
                <div class="sys-item">
                    <span class="sys-lbl">NETWORK IO</span>
                    <span class="sys-val">LOCAL / <span class="sys-hl">FITBIT API</span></span>
                </div>
            </div>

            <div class="tab-group">
                <button class="tab-btn">SETTINGS</button>
                <button class="tab-btn active">BIOMETRICS</button>
                <button class="tab-btn">DIAGNOSTICS</button>
                <button class="tab-btn">COMMANDER</button>
                <button class="tab-btn" onclick="fetchBiometrics()">FORCE SYNC</button>
            </div>

            <!-- 下段：大型生体データ（HR, STEPS, SLEEP） -->
            <div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center;">
                <div class="vital-row">
                    <!-- 心拍数 -->
                    <div class="v-block">
                        <div class="v-lbl">HR<span>CURRENT</span></div>
                        <div class="v-val" id="val-hr-current">--</div>
                    </div>
                    <!-- 歩数（劇中のSpO2のポジション） -->
                    <div class="v-block">
                        <div class="v-lbl">STP<span>DAILY STEPS</span></div>
                        <div class="v-val" id="val-steps">--</div>
                    </div>
                    <!-- 睡眠時間（劇中のRRのポジション） -->
                    <div class="v-block">
                        <div class="v-lbl">SLP<span>DURATION</span></div>
                        <div class="v-val" id="val-sleep">--</div>
                    </div>
                </div>

                <!-- 鼓動する波形アニメーション（純粋なSVGとCSSだけで描画） -->
                <div class="ecg-box">
                    <div class="ecg-grid"></div>
                    <svg width="200%" height="100%" viewBox="0 0 800 80" preserveAspectRatio="none" style="z-index: 2; position: relative;">
                        <!-- 心電図のパターンを長めに描画 -->
                        <path class="ecg-line" d="M0,40 L50,40 L60,20 L75,70 L90,10 L100,50 L110,40 L200,40 L250,40 L260,20 L275,70 L290,10 L300,50 L310,40 L400,40 L450,40 L460,20 L475,70 L490,10 L500,50 L510,40 L600,40 L650,40 L660,20 L675,70 L690,10 L700,50 L710,40 L800,40" />
                    </svg>
                </div>
            </div>

            <!-- コントロールボタン -->
            <div class="controls">
                <button class="action-btn btn-secondary" onclick="location.href='/'">◀ SYSTEM MAIN</button>
                <button class="action-btn" onclick="fetchBiometrics()">EXTRACT BIOMETRICS</button>
            </div>

        </div>
    </div>

    <script>
        async function fetchBiometrics() {
            try {
                const response = await fetch('/api/biometrics_detail');
                const data = await response.json();

                // Fitbitから取得した本物データを流し込む
                document.getElementById('val-hr-current').innerText = data.hr.current;
                // 歩数が数万歩になると文字が大きすぎるため、万単位ならカンマ付きで表示
                document.getElementById('val-steps').innerText = data.steps.count;
                // 睡眠時間
                document.getElementById('val-sleep').innerText = data.sleep.duration;

                if (data.status.includes("SYNCED")) {
                    document.getElementById('sync-status').innerText = "ONLINE / SYNCED";
                    document.getElementById('sync-status').style.color = "var(--delos-cyan)";
                }
            } catch (error) {
                console.error("Fetch Error:", error);
                document.getElementById('sync-status').innerText = "CONNECTION LOST";
                document.getElementById('sync-status').style.color = "var(--delos-alert)";
            }
        }

        // ページロード時に自動取得
        fetchBiometrics();
    </script>
</body>
</html>
