<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DELOS SYSTEM - HUD BIOMETRICS</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --delos-cyan: #4df8ff;
            --delos-cyan-dim: rgba(77, 248, 255, 0.15);
            --delos-bg: #090e11;
            --delos-grey: #6b8294;
            --delos-alert: #ff3355;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--delos-bg);
            color: var(--delos-cyan);
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow: hidden;
            text-transform: uppercase;
            background-image: 
                linear-gradient(rgba(77, 248, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(77, 248, 255, 0.05) 1px, transparent 1px);
            background-size: 15px 15px;
            position: relative;
        }

        /* --- 画面全体のレイアウト --- */
        .hud-container {
            display: grid;
            grid-template-columns: 250px 1fr 250px;
            grid-template-rows: 80px 1fr 60px;
            flex-grow: 1;
            gap: 20px;
            position: relative;
            z-index: 10;
        }

        /* --- 上部：ヘッダーと心拍数 --- */
        .hud-header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px dashed var(--delos-cyan-dim);
        }

        .host-id-box {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .host-circle {
            width: 60px; height: 60px; border: 2px solid var(--delos-cyan);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 0.5rem; text-align: center; box-shadow: 0 0 15px var(--delos-cyan-dim);
            position: relative;
        }
        .host-circle::before {
            content: ''; position: absolute; top: -5px; left: -5px; right: -5px; bottom: -5px;
            border: 1px dashed var(--delos-grey); border-radius: 50%;
            animation: rotate 15s linear infinite;
        }

        @keyframes rotate { 100% { transform: rotate(360deg); } }

        .top-vitals {
            display: flex;
            gap: 40px;
            align-items: flex-end;
        }

        .vital-group { display: flex; flex-direction: column; align-items: center; }
        .vital-label { font-size: 0.8rem; color: var(--delos-grey); font-family: 'Share Tech Mono', monospace; }
        .vital-value { font-size: 3rem; font-weight: 700; line-height: 0.9; text-shadow: 0 0 10px var(--delos-cyan-dim); }
        .vital-unit { font-size: 1rem; color: var(--delos-cyan); }
        
        /* 心拍パルスアニメーション */
        .pulse-text { color: var(--delos-alert); text-shadow: 0 0 10px rgba(255,51,85,0.5); animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        /* --- 中央：人体スキャン領域 --- */
        .hud-center {
            grid-column: 2 / 3;
            grid-row: 2 / 3;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ★外部画像ではなくSVGを使うためのスタイル */
        .body-model {
            height: 90%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* スキャンラインのアニメーション */
        .scanline {
            position: absolute;
            top: 0; left: 10%; right: 10%; height: 2px;
            background: var(--delos-cyan);
            box-shadow: 0 0 15px 3px var(--delos-cyan);
            animation: scan 3s ease-in-out infinite alternate;
            opacity: 0.8;
            z-index: 2;
        }
        @keyframes scan { 0% { top: 5%; } 100% { top: 95%; } }

        /* --- 左右のデータパネル（HUD風） --- */
        .hud-side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: center;
        }

        .data-block {
            background: rgba(77, 248, 255, 0.02);
            border: 1px solid var(--delos-cyan-dim);
            border-left: 3px solid var(--delos-cyan);
            padding: 15px;
            position: relative;
        }

        .data-block::before {
            content: ''; position: absolute; top: 50%; width: 30px; height: 1px; background: var(--delos-cyan-dim);
        }
        .left-panel .data-block::before { right: -30px; }
        .right-panel .data-block::before { left: -30px; border-left: none; border-right: 3px solid var(--delos-cyan); border-left: 1px solid var(--delos-cyan-dim); text-align: right;}

        .block-header { font-size: 0.7rem; color: var(--delos-grey); font-family: 'Share Tech Mono', monospace; margin-bottom: 10px; border-bottom: 1px dashed #333; padding-bottom: 5px; }
        .data-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 8px; font-family: 'Share Tech Mono', monospace;}
        .lbl { font-size: 0.7rem; color: var(--delos-grey); }
        .val { font-size: 1.5rem; font-weight: bold; color: #fff; }

        .progress-box { margin-top: 10px; }
        .prog-bg { width: 100%; height: 4px; background: #111; border: 1px solid #333; }
        .prog-fill { height: 100%; background: var(--delos-cyan); box-shadow: 0 0 8px var(--delos-cyan); transition: width 1s ease; }

        /* --- 下部：コントロール --- */
        .hud-footer {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 1px dashed var(--delos-cyan-dim);
            padding-top: 10px;
        }

        button {
            background: transparent; color: var(--delos-cyan); border: 1px solid var(--delos-cyan);
            padding: 8px 25px; font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 1rem;
            letter-spacing: 2px; cursor: pointer; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            transition: all 0.2s; outline: none;
        }
        button:hover { background: var(--delos-cyan); color: var(--delos-bg); }
        .btn-secondary { border-color: var(--delos-grey); color: var(--delos-grey); }
        .btn-secondary:hover { background: var(--delos-grey); color: var(--delos-bg); }

    </style>
</head>
<body>

    <div class="hud-container">
        
        <!-- 上部：HOST IDと主要バイタル -->
        <div class="hud-header">
            <div class="host-id-box">
                <div class="host-circle">HOST ID<br>AUTH</div>
                <div style="font-size: 0.6rem; color: var(--delos-grey); font-family: 'Share Tech Mono'; line-height: 1.3;">
                    TARGET: YOKOHAMA RESIDENCE<br>
                    MODULE: BIOMETRIC SCAN<br>
                    STATUS: <span style="color:var(--delos-cyan);">ACTIVE UPLINK</span>
                </div>
            </div>
            
            <div class="top-vitals">
                <div class="vital-group">
                    <span class="vital-label">CURRENT HR</span>
                    <div><span class="vital-value pulse-text" id="val-hr-current">--</span> <span class="vital-unit">BPM</span></div>
                </div>
                <div class="vital-group">
                    <span class="vital-label">RESTING HR</span>
                    <div><span class="vital-value" id="val-hr-rest" style="color: #fff;">--</span> <span class="vital-unit">BPM</span></div>
                </div>
                <div class="vital-group">
                    <span class="vital-label">SYS STATUS</span>
                    <div><span class="vital-value" id="status-hr" style="color: var(--delos-cyan); font-size: 1.5rem; line-height: 2;">SYNCING</span></div>
                </div>
            </div>
        </div>

        <!-- 左側：睡眠データパネル -->
        <div class="hud-side-panel left-panel">
            <div class="data-block">
                <div class="block-header">▶ SLEEP ARCHITECTURE</div>
                <div class="data-row">
                    <span class="lbl">TOTAL DURATION</span>
                    <span class="val" id="val-sleep-duration">-- <span style="font-size:0.8rem;">HRS</span></span>
                </div>
                <div class="data-row">
                    <span class="lbl">EFFICIENCY</span>
                    <span class="val" id="val-sleep-eff">-- <span style="font-size:0.8rem;">%</span></span>
                </div>
                <div class="progress-box">
                    <div style="display:flex; justify-content:space-between; font-size:0.6rem; color:var(--delos-grey);"><span>RECOVERY INDEX</span> <span id="val-sleep-index">--/100</span></div>
                    <div class="prog-bg"><div class="prog-fill" id="bar-sleep" style="width: 0%;"></div></div>
                </div>
            </div>
        </div>

        <!-- 中央：人体ワイヤーフレームモデルとスキャンライン -->
        <div class="hud-center">
            <div class="body-model">
                <!-- 外部画像に頼らない、コード描画(SVG)のサイバー人体設計図 -->
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 500" width="100%" height="90%" style="overflow: visible;">
                    <defs>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                            <feMerge>
                                <feMergeNode in="coloredBlur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <g stroke="var(--delos-cyan)" fill="none" stroke-width="2" filter="url(#glow)" opacity="0.5">
                        <!-- 頭部 -->
                        <ellipse cx="100" cy="50" rx="25" ry="35" />
                        <line x1="100" y1="15" x2="100" y2="85" stroke-width="1" stroke-dasharray="2 4"/>
                        <line x1="75" y1="50" x2="125" y2="50" stroke-width="1" stroke-dasharray="2 4"/>
                        <!-- 背骨 -->
                        <line x1="100" y1="85" x2="100" y2="250" />
                        <!-- 肩〜腕 -->
                        <path d="M 50 100 Q 100 80 150 100" />
                        <path d="M 50 100 Q 30 180 20 260 L 10 350" />
                        <path d="M 150 100 Q 170 180 180 260 L 190 350" />
                        <!-- 胸郭（アバラ骨風のライン） -->
                        <path d="M 100 110 C 60 110 50 170 100 200" />
                        <path d="M 100 110 C 140 110 150 170 100 200" />
                        <path d="M 100 140 C 70 140 60 170 100 190" />
                        <path d="M 100 140 C 130 140 140 170 100 190" />
                        <!-- 骨盤 -->
                        <path d="M 100 250 Q 60 250 70 300 L 100 320 L 130 300 Q 140 250 100 250" />
                        <line x1="100" y1="250" x2="100" y2="320" stroke-width="1" />
                        <!-- 脚 -->
                        <path d="M 75 305 Q 60 400 65 480" />
                        <path d="M 125 305 Q 140 400 135 480" />
                        <!-- 関節のジョイントマーカー -->
                        <circle cx="50" cy="100" r="4" fill="var(--delos-cyan)"/>
                        <circle cx="150" cy="100" r="4" fill="var(--delos-cyan)"/>
                        <circle cx="20" cy="260" r="3" fill="var(--delos-cyan)"/>
                        <circle cx="180" cy="260" r="3" fill="var(--delos-cyan)"/>
                        <circle cx="75" cy="305" r="5" fill="var(--delos-cyan)"/>
                        <circle cx="125" cy="305" r="5" fill="var(--delos-cyan)"/>
                        <circle cx="62" cy="400" r="4" fill="var(--delos-cyan)"/>
                        <circle cx="138" cy="400" r="4" fill="var(--delos-cyan)"/>
                        <!-- ターゲットサークル（心臓部周辺） -->
                        <circle cx="100" cy="150" r="60" stroke-width="0.5" stroke-dasharray="5 5" opacity="0.3"/>
                        <circle cx="100" cy="150" r="80" stroke-width="0.2" opacity="0.2"/>
                    </g>
                </svg>
            </div>
            <div class="scanline"></div>
        </div>

        <!-- 右側：活動データパネル -->
        <div class="hud-side-panel right-panel">
            <div class="data-block" style="border-left: 1px solid var(--delos-cyan-dim); border-right: 3px solid var(--delos-cyan);">
                <div class="block-header" style="text-align: right;">KINETIC ACTIVITY ◀</div>
                <div class="data-row">
                    <span class="lbl">DAILY STEPS</span>
                    <span class="val" id="val-steps">--</span>
                </div>
                <div class="data-row">
                    <span class="lbl">ENERGY EXPENDED</span>
                    <span class="val" id="val-calories">-- <span style="font-size:0.8rem;">KCAL</span></span>
                </div>
                <div class="progress-box">
                    <div style="display:flex; justify-content:space-between; font-size:0.6rem; color:var(--delos-grey);"><span>TARGET PROGRESS</span> <span id="val-step-prog">--%</span></div>
                    <div class="prog-bg"><div class="prog-fill" id="bar-steps" style="width: 0%;"></div></div>
                </div>
            </div>
        </div>

        <!-- 下部：コントロールボタン -->
        <div class="hud-footer">
            <button class="btn-secondary" onclick="location.href='/'">◀ RETURN TO MAIN</button>
            <button onclick="fetchBiometrics()">INITIATE DEEP SCAN</button>
        </div>

    </div>

    <script>
        async function fetchBiometrics() {
            try {
                const response = await fetch('/api/biometrics_detail');
                const data = await response.json();

                document.getElementById('val-sleep-duration').innerHTML = data.sleep.duration + ' <span style="font-size:0.8rem;">HRS</span>';
                document.getElementById('val-sleep-eff').innerHTML = data.sleep.efficiency + ' <span style="font-size:0.8rem;">%</span>';
                document.getElementById('val-sleep-index').innerText = data.sleep.index + " / 100";
                document.getElementById('bar-sleep').style.width = data.sleep.index + "%";
                
                document.getElementById('val-steps').innerText = data.steps.count;
                document.getElementById('val-calories').innerHTML = data.steps.calories + ' <span style="font-size:0.8rem;">KCAL</span>';
                document.getElementById('val-step-prog').innerText = data.steps.progress + "%";
                document.getElementById('bar-steps').style.width = data.steps.progress + "%";

                document.getElementById('val-hr-current').innerText = data.hr.current;
                document.getElementById('val-hr-rest').innerText = data.hr.resting;

                if (data.status.includes("SYNCED")) {
                    document.getElementById('status-hr').innerText = "ONLINE";
                }
            } catch (error) {
                console.error("Biometrics Fetch Error:", error);
                document.getElementById('status-hr').innerText = "ERROR";
                document.getElementById('status-hr').style.color = "var(--delos-alert)";
            }
        }

        fetchBiometrics();
    </script>
</body>
</html>
